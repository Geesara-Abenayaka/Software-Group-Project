server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow document uploads (backend accepts up to 20 MB)
    client_max_body_size 25M;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # API requests go to the backend container ("backend" = service name in docker-compose.yml)
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # OCR / document verification can take a while
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Vite puts hashed files in /assets, so they can be cached for a long time
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else is a React route: serve index.html and let React Router handle it
    location / {
        try_files $uri $uri/ /index.html;
    }
}
